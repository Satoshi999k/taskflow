name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install client dependencies
        run: |
          cd apps/client
          npm install
      - name: Install server dependencies
        run: |
          cd apps/server
          npm install
      - name: Run server tests
        run: |
          cd apps/server
          npm test
      - name: Run client tests
        run: |
          cd apps/client
          npm test
