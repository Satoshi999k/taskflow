version: "3.9"
services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"

  server:
    build: ./apps/server
    ports:
      - "4000:4000"
    env_file: ./apps/server/.env
    depends_on:
      - postgres
      - redis
      - minio

  client:
    build: ./apps/client
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  pgdata:
